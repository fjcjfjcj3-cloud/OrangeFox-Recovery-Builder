name: OrangeFox - Build X6886

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: "OrangeFox branch"
        required: true
        default: "12.1"

      DEVICE_TREE:
        description: "X6886 device tree"
        required: true
        default: "https://github.com/BeruCrypt02/twrp_device_infinix_X6886-a16"

      DEVICE_TREE_BRANCH:
        description: "Device tree branch"
        required: true
        default: "android-12.1"

      DEVICE_PATH:
        description: "Device path"
        required: true
        default: "device/infinix/X6886"

      DEVICE_NAME:
        description: "Device codename"
        required: true
        default: "X6886"

      BUILD_TARGET:
        description: "Build target"
        required: true
        default: "vendorboot"

jobs:
  build:
    name: Build OrangeFox X6886
    runs-on: ubuntu-22.04

    permissions:
      contents: read

    env:
      MANIFEST_BRANCH: ${{ inputs.MANIFEST_BRANCH }}
      DEVICE_TREE: ${{ inputs.DEVICE_TREE }}
      DEVICE_TREE_BRANCH: ${{ inputs.DEVICE_TREE_BRANCH }}
      DEVICE_PATH: ${{ inputs.DEVICE_PATH }}
      DEVICE_NAME: ${{ inputs.DEVICE_NAME }}
      BUILD_TARGET: ${{ inputs.BUILD_TARGET }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure swap
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 24

      - name: Install build environment
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            wget \
            unzip \
            zip \
            python3 \
            python3-pip \
            bc \
            bison \
            flex \
            build-essential

          git clone \
            https://gitlab.com/OrangeFox/misc/scripts \
            "$GITHUB_WORKSPACE/orangefox-scripts"

          cd "$GITHUB_WORKSPACE/orangefox-scripts"

          sudo bash setup/android_build_env.sh

      - name: Sync OrangeFox source
        shell: bash
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/OrangeFox"

          cd "$GITHUB_WORKSPACE/OrangeFox"

          git config --global user.name "OrangeFox Builder"
          git config --global user.email "orangefox-builder@localhost"

          git clone \
            https://gitlab.com/OrangeFox/sync.git \
            sync

          cd sync

          ./orangefox_sync.sh \
            --branch "$MANIFEST_BRANCH" \
            --path "$GITHUB_WORKSPACE/OrangeFox/fox_$MANIFEST_BRANCH"

      - name: Clone X6886 device tree
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/OrangeFox/fox_$MANIFEST_BRANCH"

          mkdir -p "$(dirname "$DEVICE_PATH")"

          git clone \
            --depth=1 \
            --branch "$DEVICE_TREE_BRANCH" \
            "$DEVICE_TREE" \
            "$DEVICE_PATH"

          echo "===== DEVICE TREE ====="

          ls -la "$DEVICE_PATH"

          echo "===== DEVICE TREE COMMIT ====="

          git -C "$DEVICE_PATH" rev-parse HEAD

      - name: Fix X6886 product definitions
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/OrangeFox/fox_$MANIFEST_BRANCH"

          PRODUCT_FILE="$DEVICE_PATH/AndroidProducts.mk"

          if [ ! -f "$PRODUCT_FILE" ]; then
            echo "ERROR: AndroidProducts.mk not found"
            exit 1
          fi

          echo "===== ORIGINAL AndroidProducts.mk ====="

          cat "$PRODUCT_FILE"

          sed -i \
            's/ofox_X6886-bp2a-eng/ofox_X6886-eng/g' \
            "$PRODUCT_FILE"

          sed -i \
            's/ofox_X6886-bp2a-userdebug/ofox_X6886-userdebug/g' \
            "$PRODUCT_FILE"

          echo "===== FIXED AndroidProducts.mk ====="

          cat "$PRODUCT_FILE"

          grep -q 'ofox_X6886-eng' "$PRODUCT_FILE"

          grep -q 'ofox_X6886-userdebug' "$PRODUCT_FILE"

          echo "AndroidProducts.mk: OK"

      - name: Fix X6886 vendorsetup
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/OrangeFox/fox_$MANIFEST_BRANCH"

          VENDORSETUP="$DEVICE_PATH/vendorsetup.sh"

          if [ ! -f "$VENDORSETUP" ]; then
            echo "ERROR: vendorsetup.sh not found"
            exit 1
          fi

          echo "===== ORIGINAL vendorsetup.sh ====="

          cat "$VENDORSETUP"

          sed -i \
            '/^[[:space:]]*add_lunch_combo[[:space:]]/d' \
            "$VENDORSETUP"

          echo "===== FIXED vendorsetup.sh ====="

          cat "$VENDORSETUP"

          if grep -q 'add_lunch_combo' "$VENDORSETUP"; then
            echo "ERROR: add_lunch_combo still exists"
            exit 1
          fi

          echo "vendorsetup.sh: OK"

      - name: Verify X6886 tree
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/OrangeFox/fox_$MANIFEST_BRANCH"

          echo "===== VERIFY DEVICE TREE ====="

          if [ ! -f "$DEVICE_PATH/AndroidProducts.mk" ]; then
            echo "ERROR: AndroidProducts.mk missing"
            exit 1
          fi

          if [ ! -f "$DEVICE_PATH/ofox_X6886.mk" ]; then
            echo "ERROR: ofox_X6886.mk missing"
            exit 1
          fi

          if [ ! -f "$DEVICE_PATH/device.mk" ]; then
            echo "ERROR: device.mk missing"
            exit 1
          fi

          if [ ! -f "$DEVICE_PATH/vendorsetup.sh" ]; then
            echo "ERROR: vendorsetup.sh missing"
            exit 1
          fi

          echo "AndroidProducts.mk : OK"
          echo "ofox_X6886.mk      : OK"
          echo "device.mk          : OK"
          echo "vendorsetup.sh     : OK"

          echo "===== VERIFY PRODUCT ====="

          if ! grep -q \
            'PRODUCT_NAME[[:space:]]*:=[[:space:]]*ofox_X6886' \
            "$DEVICE_PATH/ofox_X6886.mk"; then
            echo "ERROR: PRODUCT_NAME is wrong"
            exit 1
          fi

          if ! grep -q \
            'PRODUCT_DEVICE[[:space:]]*:=[[:space:]]*X6886' \
            "$DEVICE_PATH/ofox_X6886.mk"; then
            echo "ERROR: PRODUCT_DEVICE is wrong"
            exit 1
          fi

          echo "PRODUCT_NAME : OK"
          echo "PRODUCT_DEVICE : OK"

          echo "===== VERIFY LUNCH TARGETS ====="

          if ! grep -q \
            'ofox_X6886-eng' \
            "$DEVICE_PATH/AndroidProducts.mk"; then
            echo "ERROR: ofox_X6886-eng missing"
            exit 1
          fi

          if ! grep -q \
            'ofox_X6886-userdebug' \
            "$DEVICE_PATH/AndroidProducts.mk"; then
            echo "ERROR: ofox_X6886-userdebug missing"
            exit 1
          fi

          echo "ofox_X6886-eng : OK"
          echo "ofox_X6886-userdebug : OK"

          echo "===== VERIFY VENDOR BOOT ====="

          if ! grep -q \
            'FOX_VENDOR_BOOT_RECOVERY=1' \
            "$DEVICE_PATH/vendorsetup.sh"; then
            echo "ERROR: FOX_VENDOR_BOOT_RECOVERY is missing"
            exit 1
          fi

          echo "FOX_VENDOR_BOOT_RECOVERY : OK"

          echo "===== VERIFY ARCHITECTURE ====="

          if ! grep -q \
            'TARGET_ARCH=arm64' \
            "$DEVICE_PATH/vendorsetup.sh"; then
            echo "ERROR: TARGET_ARCH arm64 is missing"
            exit 1
          fi

          echo "TARGET_ARCH arm64 : OK"

          echo "=========================================="
          echo "DEVICE TREE VERIFICATION PASSED"
          echo "=========================================="

      - name: Build OrangeFox vendor_boot
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/OrangeFox/fox_$MANIFEST_BRANCH"

          echo "=========================================="
          echo "LOADING ANDROID BUILD ENVIRONMENT"
          echo "=========================================="

          source build/envsetup.sh

          export ALLOW_MISSING_DEPENDENCIES=true

          echo "=========================================="
          echo "LUNCH"
          echo "=========================================="

          lunch "ofox_${DEVICE_NAME}-eng"

          echo "=========================================="
          echo "BUILDING VENDOR_BOOT"
          echo "=========================================="

          mka vendorbootimage -j2

          echo "=========================================="
          echo "BUILD COMMAND FINISHED"
          echo "=========================================="

      - name: Locate OrangeFox image
        shell: bash
        run: |
          set -e

          OUT="$GITHUB_WORKSPACE/OrangeFox/fox_$MANIFEST_BRANCH/out/target/product/$DEVICE_NAME"

          echo "===== OUTPUT DIRECTORY ====="

          if [ ! -d "$OUT" ]; then
            echo "ERROR: Output directory does not exist"
            exit 1
          fi

          ls -lah "$OUT"

          echo "===== SEARCHING FOR IMAGE ====="

          IMG=""

          if [ -f "$OUT/vendor_boot.img" ]; then
            IMG="$OUT/vendor_boot.img"
          fi

          if [ -z "$IMG" ]; then
            IMG="$(find "$OUT" -maxdepth 1 -type f -name 'OrangeFox*.img' -print -quit)"
          fi

          if [ -z "$IMG" ]; then
            IMG="$(find "$OUT" -maxdepth 1 -type f -name '*.img' -print -quit)"
          fi

          if [ -z "$IMG" ]; then
            echo "ERROR: No image found"
            echo "===== IMAGE FILES ====="
            find "$OUT" -maxdepth 1 -type f -name '*.img' -print
            exit 1
          fi

          echo "IMAGE FOUND: $IMG"

          if [ "$IMG" != "$OUT/vendor_boot.img" ]; then
            cp "$IMG" "$OUT/vendor_boot.img"
          fi

          echo "===== FINAL IMAGE ====="

          ls -lh "$OUT/vendor_boot.img"

          file "$OUT/vendor_boot.img"

          echo "FILE_PATH=$OUT" >> "$GITHUB_ENV"

      - name: Check vendor_boot image
        shell: bash
        run: |
          set -e

          if [ ! -f "$FILE_PATH/vendor_boot.img" ]; then
            echo "ERROR: vendor_boot.img missing"
            exit 1
          fi

          SIZE="$(stat -c%s "$FILE_PATH/vendor_boot.img")"

          echo "vendor_boot.img size: $SIZE bytes"

          if [ "$SIZE" -lt 1048576 ]; then
            echo "ERROR: vendor_boot.img is suspiciously small"
            exit 1
          fi

          echo "vendor_boot.img basic check passed"

      - name: Upload OrangeFox vendor_boot
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-X6886-vendor_boot
          path: ${{ env.FILE_PATH }}/vendor_boot.img
          if-no-files-found: error

      - name: Build complete
        if: success()
        shell: bash
        run: |
          echo "=========================================="
          echo "ORANGEFOX BUILD SUCCESS"
          echo "=========================================="
          echo "Device : X6886"
          echo "Target : vendor_boot"
          echo "Android: 16"
          echo "Branch : 12.1"
          echo "=========================================="
