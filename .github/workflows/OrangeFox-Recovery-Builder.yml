name: OrangeFox - Build X6886

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: "OrangeFox branch"
        required: true
        default: "12.1"

      DEVICE_TREE:
        description: "X6886 device tree"
        required: true
        default: "https://github.com/BeruCrypt02/twrp_device_infinix_X6886-a16"

      DEVICE_TREE_BRANCH:
        description: "Device tree branch"
        required: true
        default: "android-12.1"

      DEVICE_PATH:
        description: "Device path"
        required: true
        default: "device/infinix/X6886"

      DEVICE_NAME:
        description: "Device codename"
        required: true
        default: "X6886"

      BUILD_TARGET:
        description: "Build target"
        required: true
        default: "vendorboot"

jobs:
  build:
    name: Build OrangeFox X6886
    runs-on: ubuntu-22.04

    permissions:
      contents: read

    env:
      MANIFEST_BRANCH: ${{ inputs.MANIFEST_BRANCH }}
      DEVICE_TREE: ${{ inputs.DEVICE_TREE }}
      DEVICE_TREE_BRANCH: ${{ inputs.DEVICE_TREE_BRANCH }}
      DEVICE_PATH: ${{ inputs.DEVICE_PATH }}
      DEVICE_NAME: ${{ inputs.DEVICE_NAME }}
      BUILD_TARGET: ${{ inputs.BUILD_TARGET }}

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # SWAP
      # ==========================================

      - name: Configure swap
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 24


      # ==========================================
      # BUILD ENVIRONMENT
      # ==========================================

      - name: Install build environment
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            wget \
            unzip \
            zip \
            python3 \
            python3-pip \
            bc \
            bison \
            flex \
            build-essential

          git clone \
            https://gitlab.com/OrangeFox/misc/scripts \
            "$GITHUB_WORKSPACE/orangefox-scripts"

          cd "$GITHUB_WORKSPACE/orangefox-scripts"

          sudo bash setup/android_build_env.sh


      # ==========================================
      # ORANGEFOX SOURCE
      # ==========================================

      - name: Sync OrangeFox source
        shell: bash
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/OrangeFox"

          cd "$GITHUB_WORKSPACE/OrangeFox"

          git config --global user.name "OrangeFox Builder"

          git config --global user.email "orangefox-builder@localhost"

          git clone \
            https://gitlab.com/OrangeFox/sync.git \
            sync

          cd sync

          ./orangefox_sync.sh \
            --branch "$MANIFEST_BRANCH" \
            --path "$GITHUB_WORKSPACE/OrangeFox/fox_$MANIFEST_BRANCH"


      # ==========================================
      # DEVICE TREE
      # ==========================================

      - name: Clone X6886 device tree
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/OrangeFox/fox_$MANIFEST_BRANCH"

          mkdir -p "$(dirname "$DEVICE_PATH")"

          git clone \
            --depth=1 \
            --branch "$DEVICE_TREE_BRANCH" \
            "$DEVICE_TREE" \
            "$DEVICE_PATH"

          echo "===== DEVICE TREE ====="

          ls -la "$DEVICE_PATH"

          echo "===== DEVICE TREE COMMIT ====="

          git -C "$DEVICE_PATH" rev-parse HEAD


      # ==========================================
      # FIX ANDROID PRODUCTS
      # ==========================================

      - name: Fix X6886 product definitions
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/OrangeFox/fox_$MANIFEST_BRANCH"

          PRODUCT_FILE="$DEVICE_PATH/AndroidProducts.mk"

          if [ ! -f "$PRODUCT_FILE" ]; then
            echo "ERROR: AndroidProducts.mk not found"

            exit 1
          fi

          echo "===== ORIGINAL AndroidProducts.mk ====="

          cat "$PRODUCT_FILE"

          echo "===== FIXING LUNCH NAMES ====="

          sed -i \
            's/ofox_X6886-bp2a-eng/ofox_X6886-eng/g' \
            "$PRODUCT_FILE"

          sed -i \
            's/ofox_X6886-bp2a-userdebug/ofox_X6886-userdebug/g' \
            "$PRODUCT_FILE"

          echo "===== FIXED AndroidProducts.mk ====="

          cat "$PRODUCT_FILE"

          echo "===== VERIFYING ====="

          grep -q "ofox_X6886-eng" "$PRODUCT_FILE"

          grep -q "ofox_X6886-userdebug" "$PRODUCT_FILE"

          echo "AndroidProducts.mk is OK"


      # ==========================================
      # FIX VENDORSETUP
      # ==========================================

      - name: Fix X6886 vendorsetup
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/OrangeFox/fox_$MANIFEST_BRANCH"

          VENDORSETUP="$DEVICE_PATH/vendorsetup.sh"

          if [ ! -f "$VENDORSETUP" ]; then
            echo "ERROR: vendorsetup.sh not found"

            exit 1
          fi

          echo "===== ORIGINAL vendorsetup.sh ====="

          cat "$VENDORSETUP"

          echo "===== REMOVING add_lunch_combo ====="

          sed -i \
            '/^[[:space:]]*add_lunch_combo[[:space:]]/d' \
            "$VENDORSETUP"

          echo "===== FIXED vendorsetup.sh ====="

          cat "$VENDORSETUP"

          echo "===== VERIFYING vendorsetup.sh ====="

          if grep -q "add_lunch_combo" "$VENDORSETUP"; then
            echo "ERROR: add_lunch_combo still exists"

            exit 1
          fi

          echo "vendorsetup.sh is OK"


      # ==========================================
      # VERIFY DEVICE TREE
      # ==========================================

      - name: Verify X6886 tree
        shell: bash
        run: |
          set -e

          cd "$G
