name: OrangeFox - Build X6886

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: "OrangeFox branch"
        required: true
        default: "12.1"

      DEVICE_TREE:
        description: "X6886 device tree"
        required: true
        default: "https://github.com/BeruCrypt02/twrp_device_infinix_X6886-a16"

      DEVICE_TREE_BRANCH:
        description: "Device tree branch"
        required: true
        default: "android-12.1"

      DEVICE_PATH:
        description: "Device path"
        required: true
        default: "device/infinix/X6886"

      DEVICE_NAME:
        description: "Device codename"
        required: true
        default: "X6886"

      BUILD_TARGET:
        description: "Build target"
        required: true
        default: "vendorboot"

jobs:
  build:
    name: Build OrangeFox X6886
    runs-on: ubuntu-22.04

    permissions:
      contents: read

    env:
      MANIFEST_BRANCH: ${{ inputs.MANIFEST_BRANCH }}
      DEVICE_TREE: ${{ inputs.DEVICE_TREE }}
      DEVICE_TREE_BRANCH: ${{ inputs.DEVICE_TREE_BRANCH }}
      DEVICE_PATH: ${{ inputs.DEVICE_PATH }}
      DEVICE_NAME: ${{ inputs.DEVICE_NAME }}
      BUILD_TARGET: ${{ inputs.BUILD_TARGET }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure swap
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 24

      - name: Install build environment
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            wget \
            unzip \
            zip \
            python3 \
            python3-pip \
            bc \
            bison \
            flex \
            build-essential

          git clone \
            https://gitlab.com/OrangeFox/misc/scripts \
            "$GITHUB_WORKSPACE/orangefox-scripts"

          cd "$GITHUB_WORKSPACE/orangefox-scripts"

          sudo bash setup/android_build_env.sh

      - name: Sync OrangeFox source
        shell: bash
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/OrangeFox"

          cd "$GITHUB_WORKSPACE/OrangeFox"

          git config --global user.name "OrangeFox Builder"
          git config --global user.email "orangefox-builder@localhost"

          git clone \
            https://gitlab.com/OrangeFox/sync.git \
            sync

          cd sync

          ./orangefox_sync.sh \
            --branch "$MANIFEST_BRANCH" \
            --path "$GITHUB_WORKSPACE/OrangeFox/fox_$MANIFEST_BRANCH"

      - name: Clone X6886 device tree
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/OrangeFox/fox_$MANIFEST_BRANCH"

          mkdir -p "$(dirname "$DEVICE_PATH")"

          git clone \
            --depth=1 \
            --branch "$DEVICE_TREE_BRANCH" \
            "$DEVICE_TREE" \
            "$DEVICE_PATH"

          echo "=========================================="
          echo "X6886 DEVICE TREE"
          echo "=========================================="

          ls -la "$DEVICE_PATH"

          echo "=========================================="
          echo "DEVICE TREE COMMIT"
          echo "=========================================="

          git -C "$DEVICE_PATH" rev-parse HEAD

      - name: Fix AndroidProducts
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/OrangeFox/fox_$MANIFEST_BRANCH"

          PRODUCT_FILE="$DEVICE_PATH/AndroidProducts.mk"

          if [ ! -f "$PRODUCT_FILE" ]; then
            echo "ERROR: AndroidProducts.mk not found"
            exit 1
          fi

          echo "===== ORIGINAL AndroidProducts.mk ====="
          cat "$PRODUCT_FILE"

          sed -i \
            's/ofox_X6886-bp2a-eng/ofox_X6886-eng/g' \
            "$PRODUCT_FILE"

          sed -i \
            's/ofox_X6886-bp2a-userdebug/ofox_X6886-userdebug/g' \
            "$PRODUCT_FILE"

          echo "===== FIXED AndroidProducts.mk ====="
          cat "$PRODUCT_FILE"

          grep -q 'ofox_X6886-eng' "$PRODUCT_FILE"
          grep -q 'ofox_X6886-userdebug' "$PRODUCT_FILE"

          echo "AndroidProducts.mk FIXED"

      - name: Create safe X6886 vendorsetup
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/OrangeFox/fox_$MANIFEST_BRANCH"

          VENDORSETUP="$DEVICE_PATH/vendorsetup.sh"

          if [ ! -d "$DEVICE_PATH" ]; then
            echo "ERROR: Device directory does not exist"
            exit 1
          fi

          echo "===== REPLACING vendorsetup.sh ====="

          cat > "$VENDORSETUP" <<'EOF'
          # X6886 OrangeFox Recovery configuration
          # Infinix HOT 60 Pro+
          # MT6789
          # Android 16
          # vendor_boot header v4

          export FOX_BUILD_DEVICE=X6886
          export TARGET_ARCH=arm64

          export FOX_AB_DEVICE=1
          export FOX_VIRTUAL_AB_DEVICE=1

          export FOX_VENDOR_BOOT_RECOVERY=1

          export FOX_LOCAL_CALLBACK_SCRIPT=device/infinix/X6886/ramdisk_callback.sh

          export OF_USE_LZMA_COMPRESSION=1
          export FOX_DRASTIC_SIZE_REDUCTION=1

          export FOX_VANILLA_BUILD=1
          export OF_DISABLE_MIUI_SPECIFIC_FEATURES=1

          export OF_DEFAULT_KEYMASTER_VERSION=7.0

          export OF_SCREEN_H=2400
          export OF_STATUS_H=144
          export OF_STATUS_INDENT_LEFT=48
          export OF_STATUS_INDENT_RIGHT=48
          export OF_HIDE_NOTCH=1
          export OF_CLOCK_POS=1

          export OF_FL_PATH1="/sys/devices/virtual/torch/torch/torch_level"
          export OF_FL_PATH2="/sys/devices/virtual/flashlight_core/flashlight/flashlight_torch"

          export OF_ADVANCED_SECURITY=1

          export OF_SKIP_FBE_DECRYPTION=0
          export OF_KEEP_DM_VERITY_FORCED_ENCRYPTION=1
          export OF_DONT_PATCH_ENCRYPTED_DEVICE=1
          export OF_FBE_METADATA_MOUNT_IGNORE=1

          export OF_MAINTAINER="B E R U"
          EOF

          chmod 644 "$VENDORSETUP"

          echo "===== NEW vendorsetup.sh ====="
          cat "$VENDORSETUP"

          echo "===== CHECKING FOR add_lunch_combo ====="

          if grep -q 'add_lunch_combo' "$VENDORSETUP"; then
            echo "ERROR: add_lunch_combo still exists"
            exit 1
          fi

          echo "No add_lunch_combo found"

      - name: Verify X6886 device tree
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/OrangeFox/fox_$MANIFEST_BRANCH"

          echo "=========================================="
          echo "VERIFYING X6886 DEVICE TREE"
          echo "=========================================="

          test -f "$DEVICE_PATH/AndroidProducts.mk"
          test -f "$DEVICE_PATH/ofox_X6886.mk"
          test -f "$DEVICE_PATH/device.mk"
          test -f "$DEVICE_PATH/vendorsetup.sh"

          echo "AndroidProducts.mk : OK"
          echo "ofox_X6886.mk      : OK"
          echo "device.mk          : OK"
          echo "vendorsetup.sh     : OK"

          echo "=========================================="
          echo "VERIFY PRODUCT"
          echo "=========================================="

          grep -q \
            'PRODUCT_NAME[[:space:]]*:=[[:space:]]*ofox_X6886' \
            "$DEVICE_PATH/ofox_X6886.mk"

          grep -q \
            'PRODUCT_DEVICE[[:space:]]*:=[[:space:]]*X6886' \
            "$DEVICE_PATH/ofox_X6886.mk"

          echo "PRODUCT_NAME  : OK"
          echo "PRODUCT_DEVICE: OK"

          echo "=========================================="
          echo "VERIFY LUNCH TARGETS"
          echo "=========================================="

          grep -q \
            'ofox_X6886-eng' \
            "$DEVICE_PATH/AndroidProducts.mk"

          grep -q \
            'ofox_X6886-userdebug' \
            "$DEVICE_PATH/AndroidProducts.mk"

          echo "ofox_X6886-eng       : OK"
          echo "ofox_X6886-userdebug : OK"

          echo "=========================================="
          echo "VERIFY VENDOR BOOT"
          echo "=========================================="

          grep -q \
            'FOX_VENDOR_BOOT_RECOVERY=1' \
            "$DEVICE_PATH/vendorsetup.sh"

          echo "FOX_VENDOR_BOOT_RECOVERY: OK"

          echo "=========================================="
          echo "VERIFY ARM64"
          echo "=========================================="

          grep -q \
            'TARGET_ARCH=arm64' \
            "$DEVICE_PATH/vendorsetup.sh"

          echo "TARGET_ARCH=arm64: OK"

          echo "=========================================="
          echo "DEVICE TREE CHECK PASSED"
          echo "=========================================="

      - name: Load Android build environment
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/OrangeFox/fox_$MANIFEST_BRANCH"

          echo "=========================================="
          echo "LOADING ANDROID BUILD ENVIRONMENT"
          echo "=========================================="

          source build/envsetup.sh

          echo "=========================================="
          echo "ENVIRONMENT LOADED"
          echo "=========================================="

          echo "FOX_BUILD_DEVICE=$FOX_BUILD_DEVICE"
          echo "TARGET_ARCH=$TARGET_ARCH"
          echo "FOX_AB_DEVICE=$FOX_AB_DEVICE"
          echo "FOX_VIRTUAL_AB_DEVICE=$FOX_VIRTUAL_AB_DEVICE"
          echo "FOX_VENDOR_BOOT_RECOVERY=$FOX_VENDOR_BOOT_RECOVERY"

          export ALLOW_MISSING_DEPENDENCIES=true

          echo "ALLOW_MISSING_DEPENDENCIES=$ALLOW_MISSING_DEPENDENCIES"

      - name: Lunch X6886
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/OrangeFox/fox_$MANIFEST_BRANCH"

          source build/envsetup.sh

          export ALLOW_MISSING_DEPENDENCIES=true

          echo "=========================================="
          echo "LUNCH X6886"
          echo "=========================================="

          lunch "ofox_${DEVICE_NAME}-eng"

          echo "=========================================="
          echo "LUNCH SUCCESS"
          echo "=========================================="

      - name: Build OrangeFox vendor_boot
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/OrangeFox/fox_$MANIFEST_BRANCH"

          source build/envsetup.sh

          export ALLOW_MISSING_DEPENDENCIES=true

          echo "=========================================="
          echo "LUNCH"
          echo "=========================================="

          lunch "ofox_${DEVICE_NAME}-eng"

          echo "=========================================="
          echo "BUILDING VENDOR_BOOT"
          echo "=========================================="

          mka vendorbootimage -j2

          echo "=========================================="
          echo "BUILD FINISHED"
          echo "=========================================="

      - name: Locate OrangeFox image
        shell: bash
        run: |
          set -e

          OUT="$GITHUB_WORKSPACE/OrangeFox/fox_$MANIFEST_BRANCH/out/target/product/$DEVICE_NAME"

          echo "=========================================="
          echo "CHECK OUTPUT"
          echo "=========================================="

          if [ ! -d "$OUT" ]; then
            echo "ERROR: Output directory not found"
            exit 1
          fi

          ls -lah "$OUT"

          IMG=""

          if [ -f "$OUT/vendor_boot.img" ]; then
            IMG="$OUT/vendor_boot.img"
          fi

          if [ -z "$IMG" ]; then
            IMG="$(find "$OUT" \
              -maxdepth 1 \
              -type f \
              -name 'OrangeFox*.img' \
              -print -quit)"
          fi

          if [ -z "$IMG" ]; then
            IMG="$(find "$OUT" \
              -maxdepth 1 \
              -type f \
              -name '*.img' \
              -print -quit)"
          fi

          if [ -z "$IMG" ]; then
            echo "ERROR: No IMG file found"

            echo "===== AVAILABLE IMG FILES ====="

            find "$OUT" \
              -maxdepth 1 \
              -type f \
              -name '*.img' \
              -print

            exit 1
          fi

          echo "IMAGE FOUND:"
          echo "$IMG"

          if [ "$IMG" != "$OUT/vendor_boot.img" ]; then
            cp "$IMG" "$OUT/vendor_boot.img"
          fi

          echo "=========================================="
          echo "FINAL vendor_boot.img"
          echo "=========================================="

          ls -lh "$OUT/vendor_boot.img"

          file "$OUT/vendor_boot.img"

          echo "FILE_PATH=$OUT" >> "$GITHUB_ENV"

      - name: Check vendor_boot image
        shell: bash
        run: |
          set -e

          if [ ! -f "$FILE_PATH/vendor_boot.img" ]; then
            echo "ERROR: vendor_boot.img missing"
            exit 1
          fi

          SIZE="$(stat -c%s "$FILE_PATH/vendor_boot.img")"

          echo "vendor_boot.img size: $SIZE bytes"

          if [ "$SIZE" -lt 1048576 ]; then
            echo "ERROR: vendor_boot.img is too small"
            exit 1
          fi

          echo "vendor_boot.img check PASSED"

      - name: Upload OrangeFox vendor_boot
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-X6886-vendor_boot
          path: ${{ env.FILE_PATH }}/vendor_boot.img
          if-no-files-found: error

      - name: Build complete
        if: success()
        shell: bash
        run: |
          echo "=========================================="
          echo "ORANGEFOX BUILD SUCCESS"
          echo "=========================================="
          echo "Device : X6886"
          echo "Target : vendor_boot"
          echo "Android: 16"
          echo "Branch : 12.1"
          echo "=========================================="
