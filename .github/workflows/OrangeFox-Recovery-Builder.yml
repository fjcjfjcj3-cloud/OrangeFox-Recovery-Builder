name: OrangeFox - Build X6886

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: OrangeFox Branch
        required: true
        default: "12.1"
        type: choice
        options:
          - "12.1"
          - "11.0"

      DEVICE_TREE:
        description: Custom Recovery Tree
        required: true
        default: "https://github.com/BeruCrypt02/twrp_device_infinix_X6886-a16"

      DEVICE_TREE_BRANCH:
        description: Custom Recovery Tree Branch
        required: true
        default: "android-12.1"

      DEVICE_PATH:
        description: Device tree path
        required: true
        default: "device/infinix/X6886"

      DEVICE_NAME:
        description: Device codename
        required: true
        default: "X6886"

      BUILD_TARGET:
        description: Build target
        required: true
        default: "vendorboot"
        type: choice
        options:
          - "vendorboot"

      LDCHECK:
        description: Blob path to check
        required: true
        default: "vendor/bin/tee"

      RECOVERY_INSTALLER:
        description: Include recovery installer zip
        required: true
        default: true
        type: boolean

jobs:
  build:
    name: Build OrangeFox X6886
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    permissions:
      contents: read

    env:
      MANIFEST_BRANCH: ${{ inputs.MANIFEST_BRANCH }}
      DEVICE_TREE: ${{ inputs.DEVICE_TREE }}
      DEVICE_TREE_BRANCH: ${{ inputs.DEVICE_TREE_BRANCH }}
      DEVICE_PATH: ${{ inputs.DEVICE_PATH }}
      DEVICE_NAME: ${{ inputs.DEVICE_NAME }}
      BUILD_TARGET: ${{ inputs.BUILD_TARGET }}
      LDCHECK: ${{ inputs.LDCHECK }}
      FOX_ROOT: ${{ github.workspace }}/OrangeFox
      FOX_PATH: ${{ github.workspace }}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}

    steps:

      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Free disk space
        shell: bash
        run: |
          set -eux

          sudo apt-get clean

          sudo rm -rf /usr/local/lib/android/sdk/ndk || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/share/boost || true

          df -h

      - name: Create 24GB swap
        shell: bash
        run: |
          set -eux

          if ! swapon --show | grep -q "/swapfile"; then
            sudo fallocate -l 24G /swapfile
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
          fi

          free -h
          swapon --show

      - name: Install build dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            wget \
            rsync \
            unzip \
            zip \
            bc \
            bison \
            build-essential \
            ccache \
            flex \
            g++-multilib \
            gcc-multilib \
            gnupg \
            gperf \
            imagemagick \
            lib32ncurses-dev \
            lib32readline-dev \
            lib32z1-dev \
            libelf-dev \
            liblz4-tool \
            libncurses5-dev \
            libncurses6 \
            libncurses-dev \
            libsdl1.2-dev \
            libssl-dev \
            libxml2 \
            libxml2-utils \
            lzop \
            pngcrush \
            rsync \
            schedtool \
            squashfs-tools \
            xsltproc \
            zip \
            zlib1g-dev \
            python3 \
            python3-pip

      - name: Configure git
        shell: bash
        run: |
          set -eux

          git config --global user.name "OrangeFox Builder"
          git config --global user.email "builder@localhost"

      - name: Initialize OrangeFox source
        shell: bash
        run: |
          set -eux

          mkdir -p "${FOX_ROOT}"
          cd "${FOX_ROOT}"

          git clone --depth=1 \
            -b "${MANIFEST_BRANCH}" \
            https://gitlab.com/OrangeFox/misc_device_xiaomi_whyred.git \
            fox_manifest_temp || true

          rm -rf fox_manifest_temp

          git clone --depth=1 \
            -b "${MANIFEST_BRANCH}" \
            https://gitlab.com/OrangeFox/Manifest.git \
            fox_manifest

          cd fox_manifest

          mkdir -p .repo/local_manifests

          cat > .repo/local_manifests/x6886.xml <<EOF
<?xml version="1.0" encoding="UTF-8"?>
<manifest>
    <remote
        name="github"
        fetch="https://github.com/" />

    <project
        name="BeruCrypt02/twrp_device_infinix_X6886-a16"
        path="device/infinix/X6886"
        remote="github"
        revision="android-12.1" />
</manifest>
EOF

      - name: Sync OrangeFox source
        shell: bash
        run: |
          set -eux

          cd "${FOX_PATH}/fox_manifest"

          if [ ! -f ".repo/repo/repo" ]; then
            mkdir -p .repo/repo
            curl https://storage.googleapis.com/git-repo-downloads/repo \
              -o .repo/repo/repo
            chmod a+x .repo/repo/repo
          fi

          export PATH="${PWD}/.repo/repo:${PATH}"

          repo init \
            --depth=1 \
            -u https://gitlab.com/OrangeFox/Manifest.git \
            -b "${MANIFEST_BRANCH}"

          mkdir -p .repo/local_manifests

          cat > .repo/local_manifests/x6886.xml <<EOF
<?xml version="1.0" encoding="UTF-8"?>
<manifest>
    <remote
        name="github"
        fetch="https://github.com/" />

    <project
        name="BeruCrypt02/twrp_device_infinix_X6886-a16"
        path="device/infinix/X6886"
        remote="github"
        revision="android-12.1" />
</manifest>
EOF

          repo sync -c \
            --no-clone-bundle \
            --no-tags \
            --optimized-fetch \
            --prune \
            --force-sync \
            -j2

      - name: Fix X6886 product definition
        shell: bash
        run: |
          set -eux

          cd "${FOX_PATH}/fox_manifest"

          PRODUCT_FILE="${DEVICE_PATH}/AndroidProducts.mk"

          if [ ! -f "${PRODUCT_FILE}" ]; then
            echo "ERROR: ${PRODUCT_FILE} not found"
            exit 1
          fi

          echo "Before fix:"
          cat "${PRODUCT_FILE}"

          sed -i 's/ofox_X6886-bp2a-eng/ofox_X6886-eng/g' \
            "${PRODUCT_FILE}"

          echo "After fix:"
          cat "${PRODUCT_FILE}"

          if ! grep -q "ofox_X
