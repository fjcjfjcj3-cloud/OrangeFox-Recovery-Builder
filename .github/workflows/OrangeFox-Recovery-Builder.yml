name: OrangeFox - Build

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: "OrangeFox Branch"
        required: true
        default: "12.1"

      DEVICE_TREE:
        description: "Custom Recovery Tree"
        required: true
        default: "https://github.com/BeruCrypt02/twrp_device_infinix_X6886-a16"

      DEVICE_TREE_BRANCH:
        description: "Custom Recovery Tree Branch"
        required: true
        default: "android-12.1"

      DEVICE_PATH:
        description: "Specify your device path"
        required: true
        default: "device/infinix/X6886"

      DEVICE_NAME:
        description: "Specify your Device Codename"
        required: true
        default: "X6886"

      BUILD_TARGET:
        description: "Specify your Build Target"
        required: true
        default: "vendorboot"

      LDCHECK:
        description: "Path of blobs to check"
        required: true
        default: "vendor/bin/tee"

      RECOVERY_TAR:
        description: "Release recovery.tar for Samsung devices"
        required: true
        type: boolean
        default: false

      RECOVERY_INSTALLER:
        description: "Include recovery installer zip"
        required: true
        type: boolean
        default: true

jobs:
  build:
    name: Build OrangeFox for X6886
    runs-on: ubuntu-latest

    if: github.event.repository.owner.id == github.event.sender.id

    permissions:
      contents: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Clean-up
        uses: rokibhasansagar/slimhub_actions@main

      - name: Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 24

      - name: Build Environment
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt update
          sudo apt -y upgrade

          git clone https://gitlab.com/OrangeFox/misc/scripts "$GITHUB_WORKSPACE/scripts"

          cd "$GITHUB_WORKSPACE/scripts"

          sudo bash setup/android_build_env.sh

      - name: Set up OrangeFox source
        shell: bash
        env:
          MANIFEST_BRANCH: ${{ inputs.MANIFEST_BRANCH }}
        run: |
          set -euxo pipefail

          mkdir -p "$GITHUB_WORKSPACE/OrangeFox"

          cd "$GITHUB_WORKSPACE/OrangeFox"

          git config --global user.name "OrangeFox Builder"
          git config --global user.email "builder@localhost"

          git clone https://gitlab.com/OrangeFox/sync.git

          cd sync

          ./orangefox_sync.sh \
            --branch "$MANIFEST_BRANCH" \
            --path "$GITHUB_WORKSPACE/OrangeFox/fox_$MANIFEST_BRANCH"

      - name: Clone X6886 device tree
        shell: bash
        env:
          MANIFEST_BRANCH: ${{ inputs.MANIFEST_BRANCH }}
          DEVICE_TREE: ${{ inputs.DEVICE_TREE }}
          DEVICE_TREE_BRANCH: ${{ inputs.DEVICE_TREE_BRANCH }}
          DEVICE_PATH: ${{ inputs.DEVICE_PATH }}
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE/OrangeFox/fox_$MANIFEST_BRANCH"

          mkdir -p "$(dirname "$DEVICE_PATH")"

          git clone \
            --depth=1 \
            --branch "$DEVICE_TREE_BRANCH" \
            "$DEVICE_TREE" \
            "$DEVICE_PATH"

          echo "===== DEVICE TREE ====="

          ls -la "$DEVICE_PATH"

          echo "===== DEVICE TREE COMMIT ====="

          git -C "$DEVICE_PATH" rev-parse HEAD

      - name: Fix X6886 device tree
        shell: bash
        env:
          MANIFEST_BRANCH: ${{ inputs.MANIFEST_BRANCH }}
          DEVICE_PATH: ${{ inputs.DEVICE_PATH }}
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE/OrangeFox/fox_$MANIFEST_BRANCH"

          PRODUCT_FILE="$DEVICE_PATH/AndroidProducts.mk"
          VENDORSETUP_FILE="$DEVICE_PATH/vendorsetup.sh"

          if [ ! -f "$PRODUCT_FILE" ]; then
            echo "ERROR: AndroidProducts.mk was not found"
            exit 1
          fi

          echo "===== AndroidProducts.mk BEFORE ====="

          cat "$PRODUCT_FILE"

          echo "===== Fixing product name ====="

          sed -i \
            's/ofox_X6886-bp2a-eng/ofox_X6886-eng/g' \
            "$PRODUCT_FILE"

          echo "===== Creating vendorsetup.sh ====="

          touch "$VENDORSETUP_FILE"

          chmod 644 "$VENDORSETUP_FILE"

          echo "===== AndroidProducts.mk AFTER ====="

          cat "$PRODUCT_FILE"

          echo "===== vendorsetup.sh ====="

          ls -l "$VENDORSETUP_FILE"

          echo "===== Checking OrangeFox lunch target ====="

          grep -n "ofox_X6886" "$PRODUCT_FILE"

      - name: Build OrangeFox vendor_boot
        shell: bash
        env:
          MANIFEST_BRANCH: ${{ inputs.MANIFEST_BRANCH }}
          DEVICE_NAME: ${{ inputs.DEVICE_NAME }}
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE/OrangeFox/fox_$MANIFEST_BRANCH"

          echo "===== SOURCE ENVIRONMENT ====="

          source build/envsetup.sh

          export ALLOW_MISSING_DEPENDENCIES=true

          echo "===== LUNCH ====="

          lunch "ofox_${DEVICE_NAME}-eng"

          echo "===== BUILD ====="

          mka vendorbootimage -j2

      - name: Find OrangeFox image
        shell: bash
        env:
          MANIFEST_BRANCH: ${{ inputs.MANIFEST_BRANCH }}
          DEVICE_NAME: ${{ inputs.DEVICE_NAME }}
        run: |
          set -euxo pipefail

          OUT="$GITHUB_WORKSPACE/OrangeFox/fox_$MANIFEST_BRANCH/out/target/product/$DEVICE_NAME"

          echo "===== OUTPUT DIRECTORY ====="

          ls -lah "$OUT"

          IMG="$(find "$OUT" -maxdepth 1 -type f -name 'OrangeFox*.img' | head -n 1)"

          if [ -z "$IMG" ]; then
            echo "ERROR: OrangeFox image was not found"
            exit 1
          fi

          echo "===== ORANGEFOX IMAGE ====="

          echo "$IMG"

          cp "$IMG" "$OUT/vendor_boot.img"

          echo "FILE_PATH=$OUT" >> "$GITHUB_ENV"
          echo "RECOVERY_TYPE=vendor_boot" >> "$GITHUB_ENV"
          echo "CHECK_IMG_IS_OK=true" >> "$GITHUB_ENV"

      - name: Include Recovery Installer
        if: ${{ inputs.RECOVERY_INSTALLER }}
        shell: bash
        run: |
          set -euxo pipefail

          cd "$FILE_PATH"

          wget -q \
            https://github.com/kinguser981/recovery-installer/releases/download/11256427880/recovery-installer.zip

          zip -ur recovery-installer.zip vendor_boot.img

      - name: Upload Build Artifact
        if: env.CHECK_IMG_IS_OK == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-X6886-vendor_boot
          path: |
            ${{ env.FILE_PATH }}/vendor_boot.img
            ${{ env.FILE_PATH }}/recovery-installer.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: env.CHECK_IMG_IS_OK == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "X6886-${{ github.run_number }}"
          name: "OrangeFox X6886 - Build ${{ github.run_number }}"
          files: |
            ${{ env.FILE_PATH }}/vendor_boot.img
            ${{ env.FILE_PATH }}/recovery-installer.zip
          body: |
            Device: Infinix HOT 60 Pro+ X6886
            Target: vendor_boot
            OrangeFox Branch: ${{ inputs.MANIFEST_BRANCH }}
            Device Tree: ${{ inputs.DEVICE_TREE }}
            Device Tree Branch: ${{ inputs.DEVICE_TREE_BRANCH }}
