name: OrangeFox - Build

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: "OrangeFox Branch"
        required: true
        default: "12.1"

      DEVICE_TREE:
        description: "Custom Recovery Tree"
        required: true
        default: "https://github.com/BeruCrypt02/twrp_device_infinix_X6886-a16"

      DEVICE_TREE_BRANCH:
        description: "Custom Recovery Tree Branch"
        required: true
        default: "android-12.1"

      DEVICE_PATH:
        description: "Device path"
        required: true
        default: "device/infinix/X6886"

      DEVICE_NAME:
        description: "Device codename"
        required: true
        default: "X6886"

      BUILD_TARGET:
        description: "Build target"
        required: true
        default: "vendorboot"

      LDCHECK:
        description: "Blob path"
        required: true
        default: "vendor/bin/tee"

      RECOVERY_INSTALLER:
        description: "Include recovery installer"
        required: true
        type: boolean
        default: true

jobs:
  build:
    name: Build OrangeFox for X6886
    runs-on: ubuntu-latest

    if: github.event.repository.owner.id == github.event.sender.id

    permissions:
      contents: write

    env:
      MANIFEST_BRANCH: ${{ inputs.MANIFEST_BRANCH }}
      DEVICE_TREE: ${{ inputs.DEVICE_TREE }}
      DEVICE_TREE_BRANCH: ${{ inputs.DEVICE_TREE_BRANCH }}
      DEVICE_PATH: ${{ inputs.DEVICE_PATH }}
      DEVICE_NAME: ${{ inputs.DEVICE_NAME }}
      BUILD_TARGET: ${{ inputs.BUILD_TARGET }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Clean-up
        uses: rokibhasansagar/slimhub_actions@main

      - name: Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 24

      - name: Build Environment
        shell: bash
        run: |
          set -e

          sudo apt update
          sudo apt -y upgrade

          git clone https://gitlab.com/OrangeFox/misc/scripts

          cd scripts

          sudo bash setup/android_build_env.sh

      - name: Set-up OrangeFox Manifest
        shell: bash
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/OrangeFox"

          cd "$GITHUB_WORKSPACE/OrangeFox"

          git config --global user.name "OrangeFox Builder"
          git config --global user.email "builder@localhost"

          git clone https://gitlab.com/OrangeFox/sync.git

          cd sync

          ./orangefox_sync.sh \
            --branch "$MANIFEST_BRANCH" \
            --path "$GITHUB_WORKSPACE/OrangeFox/fox_$MANIFEST_BRANCH"

      - name: Clone X6886 Device Tree
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/OrangeFox/fox_$MANIFEST_BRANCH"

          mkdir -p "$(dirname "$DEVICE_PATH")"

          git clone \
            --depth=1 \
            --branch "$DEVICE_TREE_BRANCH" \
            "$DEVICE_TREE" \
            "$DEVICE_PATH"

          echo "===== DEVICE TREE ====="
          ls -la "$DEVICE_PATH"

          echo "===== DEVICE TREE COMMIT ====="
          git -C "$DEVICE_PATH" rev-parse HEAD

      - name: Fix X6886 Device Tree
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/OrangeFox/fox_$MANIFEST_BRANCH"

          PRODUCT_FILE="$DEVICE_PATH/AndroidProducts.mk"
          VENDORSETUP_FILE="$DEVICE_PATH/vendorsetup.sh"

          if [ ! -f "$PRODUCT_FILE" ]; then
            echo "ERROR: AndroidProducts.mk not found"
            exit 1
          fi

          echo "===== AndroidProducts.mk BEFORE ====="
          cat "$PRODUCT_FILE"

          echo "===== Fixing old product name ====="

          sed -i \
            's/ofox_X6886-bp2a-eng/ofox_X6886-eng/g' \
            "$PRODUCT_FILE"

          echo "===== Creating vendorsetup.sh ====="

          if [ ! -f "$VENDORSETUP_FILE" ]; then
            printf '%s\n' '#!/bin/bash' > "$VENDORSETUP_FILE"
          fi

          chmod 644 "$VENDORSETUP_FILE"

          echo "===== AndroidProducts.mk AFTER ====="
          cat "$PRODUCT_FILE"

          echo "===== vendorsetup.sh ====="
          cat "$VENDORSETUP_FILE"

          echo "===== Checking lunch target ====="

          grep -q "ofox_X6886-eng" "$PRODUCT_FILE"

          echo "X6886 lunch target OK"

      - name: Build OrangeFox
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/OrangeFox/fox_$MANIFEST_BRANCH"

          echo "===== Loading Android build environment ====="

          source build/envsetup.sh

          export ALLOW_MISSING_DEPENDENCIES=true

          echo "===== Lunch ====="

          lunch "ofox_${DEVICE_NAME}-eng"

          echo "===== Build target ====="

          mka vendorbootimage -j2

      - name: Find OrangeFox Image
        shell: bash
        run: |
          set -e

          OUT="$GITHUB_WORKSPACE/OrangeFox/fox_$MANIFEST_BRANCH/out/target/product/$DEVICE_NAME"

          echo "===== OUTPUT DIRECTORY ====="

          ls -lah "$OUT"

          IMG="$(find "$OUT" -maxdepth 1 -type f -name 'OrangeFox*.img' | head -n 1)"

          if [ -z "$IMG" ]; then
            echo "ERROR: OrangeFox image was not found"
            echo "Searching all output directories..."

            find "$GITHUB_WORKSPACE/OrangeFox/fox_$MANIFEST_BRANCH/out" \
              -type f \
              \( -name "*.img" -o -name "vendor_boot*" \) \
              | head -100

            exit 1
          fi

          echo "===== ORANGEFOX IMAGE FOUND ====="
          echo "$IMG"

          cp "$IMG" "$OUT/vendor_boot.img"

          echo "FILE_PATH=$OUT" >> "$GITHUB_ENV"
          echo "RECOVERY_TYPE=vendor_boot" >> "$GITHUB_ENV"
          echo "CHECK_IMG_IS_OK=true" >> "$GITHUB_ENV"

      - name: Include Recovery Installer
        if: ${{ inputs.RECOVERY_INSTALLER }}
        shell: bash
        run: |
          set -e

          cd "$FILE_PATH"

          wget -q \
            https://github.com/kinguser981/recovery-installer/releases/download/11256427880/recovery-installer.zip

          zip -ur recovery-installer.zip vendor_boot.img

      - name: Upload Build Artifact
        if: env.CHECK_IMG_IS_OK == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-X6886-vendor_boot
          path: |
            ${{ env.FILE_PATH }}/vendor_boot.img
            ${{ env.FILE_PATH }}/recovery-installer.zip
          if-no-files-found: error
